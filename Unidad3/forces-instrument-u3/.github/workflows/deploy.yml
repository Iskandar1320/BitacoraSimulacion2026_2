name: Deploy Unidad 3 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Unidad3/forces-instrument-u3/**"
      - ".github/workflows/deploy-unidad3.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Unidad3/forces-instrument-u3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Unidad3/forces-instrument-u3/package-lock.json

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Unidad3/forces-instrument-u3/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4